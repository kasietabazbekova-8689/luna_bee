name: Deploy Luna Beauty Salon to EKS

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: luna-eks

jobs:
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest

    steps:

      # 1. Get repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Authenticate GitHub Actions to AWS
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 3. Configure kubectl to connect to EKS
      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER_NAME

      # 4. Verify connection to EKS
      - name: Verify EKS connection
        run: |
          kubectl get nodes

      # 5. Deploy Kubernetes Deployment
      - name: Deploy application
        run: |
          kubectl apply -f deployment.yaml

      # 6. Deploy Kubernetes Service
      - name: Deploy service
        run: |
          kubectl apply -f service.yaml

      # 7. Wait for deployment
      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/luna-beauty-salon \
            --timeout=180s

      # 8. Show result
      - name: Verify deployment
        run: |
          echo "===== PODS ====="
          kubectl get pods -o wide

          echo "===== SERVICES ====="
          kubectl get svc

          echo "===== DEPLOYMENT ====="
          kubectl get deployment luna-beauty-salon
